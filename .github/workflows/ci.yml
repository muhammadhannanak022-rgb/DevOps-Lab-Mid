
name: Assignment Portal CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    env:
      RECEIVER_URL: ${{ secrets.RECEIVER_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-json-report

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: |
          pytest --json-report --json-report-file=pytest-report.json

      - name: Build JSON test report
        if: always()
        run: python build_report.py

      - name: Send report to local computer
        if: always() && env.RECEIVER_URL != ''
        env:
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: |
          curl --fail --show-error \
            --retry 3 \
            -H "Authorization: Bearer $RECEIVER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @test-report.json \
            "$RECEIVER_URL/report"

      - name: Email CI test report
        if: always()
        continue-on-error: true
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage

          sender = "muhammadhannanak022@gmail.com"
          recipient = sender

          if not os.environ.get("SMTP_PASSWORD"):
              print("SMTP_PASSWORD missing; email skipped.")
              raise SystemExit(0)

          msg = EmailMessage()
          msg["Subject"] = "DevOps Lab Mid - CI Test Report"
          msg["From"] = sender
          msg["To"] = recipient
          msg.set_content("GitHub Actions CI test report is attached.")

          with open("test-report.json", "rb") as f:
              msg.add_attachment(
                  f.read(),
                  maintype="application",
                  subtype="json",
                  filename="test-report.json"
              )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(sender, os.environ["SMTP_PASSWORD"])
              smtp.send_message(msg)

          print("EMAIL SENT SUCCESSFULLY")
          PY


      - name: Fail pipeline if tests failed
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Automated tests failed!"
            exit 1
          fi

  deploy-pages:
    needs: test-and-report
    if: github.ref == 'refs/heads/main' && needs.test-and-report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
